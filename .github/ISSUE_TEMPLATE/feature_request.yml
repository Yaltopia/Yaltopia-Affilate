name: Feature request
description: Propose a product or landing change that is not a schema/RBAC change.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: Who is stuck and what they cannot do today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
    validations:
      required: true
  - type: dropdown
    id: role
    attributes:
      label: Primary role
      options:
        - Creator
        - Advertiser
        - Admin
        - Payout Agent
        - Shopper / public
    validations:
      required: true
