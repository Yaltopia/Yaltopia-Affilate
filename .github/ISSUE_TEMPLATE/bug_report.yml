name: Bug report
description: Something is broken in the spec, landing, or schema.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, service keys, or payout account numbers.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw versus what you expected.
    validations:
      required: true
  - type: input
    id: surface
    attributes:
      label: Surface
      description: e.g. marketing `/`, docs, Firebase rules, Supabase SQL
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
